services:
 
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    environment:
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - "discovery.type=single-node"
      #
      #

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      interval: 10s
      retries: 12
      test: curl --write-out 'HTTP %{http_code}' --fail --silent --output /dev/null http://localhost:9200/


  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.9
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - NODE_OPTIONS=--max-old-space-size=512
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch 
    


  minio:
    container_name: minio
    image: minio/minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    # התיקון כאן: הוספנו את הכתובת ל-console
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # עבור API / S3 requests
      - "9001:9001" # עבור ממשק המשתמש (UI)
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
    command: ["redis-server"]

  rabbitmq:
    image: rabbitmq:latest
    container_name: rabbitmq
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: yehuda
      RABBITMQ_DEFAULT_PASS: yehuda
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq


  catalog_management:
    container_name: catalog_management
    build:
      context: ./
      dockerfile: ./services/catalog_management/Dockerfile
    volumes:
      - ./services/catalog_management:/WORKDIR
    ports:
      - "8000:8000"
    depends_on:
      - minio
      - elasticsearch
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - MINIO_URL=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - SECRET_KEY=mysecretkey
    
    
  store-front-service:
    container_name: store-front-service
    build:
      context: ./
      dockerfile: ./services/store-front-service/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./services/store-front-service:/WORKDIR
    environment:
      - CATALOG_SERVICE_URL=http://catalog_management:8000
    
      # - LOHIN_SERVICE_NAME=user-management #כבר אין צורך בשלב הזה
      
      - MINIO_URL=host.docker.internal:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - CATALOG_SERVICE_HOST=catalog_management
      - USER_SERVICE_HOST=user-service
      - SECRET_KEY=mysecretkey
      
    depends_on:
      - catalog_management
      - user-service 
  
  


  user-service:
    container_name: user-service
    build:
      context: ./
      dockerfile: ./services/user-management/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./services/user-management:/WORKDIR
    depends_on:
      - minio
      - elasticsearch
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      
    environment:
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - SECRET_KEY=mysecretkey # חשוב להפיץ בין הסרוויסים

configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."  


volumes:
  elasticsearch_data:
  minio_data:
  redis_data:
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local

  