services:
 
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    environment:
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - "discovery.type=single-node"
      

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.9
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - NODE_OPTIONS=--max-old-space-size=512
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch 
    


  minio:
    container_name: minio
    image: minio/minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001" 
    volumes:
      - minio_data:/data

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 3s
      retries: 5
    command: ["redis-server"]

  rabbitmq:
    image: rabbitmq:latest
    container_name: rabbitmq
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: yehuda
      RABBITMQ_DEFAULT_PASS: 1234
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  catalog_management:
    container_name: catalog_management
    build:
      context: ./
      dockerfile: ./services/catalog_management/Dockerfile
    volumes:
      - ./services/catalog_management:/WORKDIR
    ports:
      - "8000:8000"
    depends_on:
      - minio
      - elasticsearch
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      
    environment:
      - SECRET_KEY=mysecretkey
      
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      
      - MINIO_URL=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    
    
  store-front-service:
    container_name: store-front-service
    build:
      context: ./
      dockerfile: ./services/store-front-service/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ./services/store-front-service:/WORKDIR
    environment:
      - CATALOG_SERVICE_URL=http://catalog_management:8000
      - MINIO_URL=host.docker.internal:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - CATALOG_SERVICE_HOST=catalog_management
      - USER_SERVICE_HOST=user-management
      - ORDER_SERVICE_URL=http://order-management:8004
      - SECRET_KEY=mysecretkey
      
  
  


  user-management:
    container_name: user-management
    build:
      context: ./
      dockerfile: ./services/user-management/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./services/user-management:/WORKDIR
    depends_on:
      - minio
      - elasticsearch
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      
    environment:
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - SECRET_KEY=mysecretkey # חשוב להפיץ בין הסרוויסים
  
  cart-service:
    container_name: cart-service
    build:
      context: ./
      dockerfile: ./services/cart_service/Dockerfile
    ports:
      - "8003:8003"

    volumes:
      - ./services/cart_service:/WORKDIR
    environment:
      - SECRET_KEY=mysecretkey
      - CATALOG_SERVICE_URL=http://catalog_management:8000


    depends_on:
      elasticsearch:
        condition: service_started
      redis:
        condition: service_started
      catalog_management:
        condition: service_started
      

  order-management:
    container_name: order-management
    build:
      context: ./
      dockerfile: ./services/order_management/Dockerfile
    ports:
      - "8004:8004"
    volumes:
      - ./services/order_management:/WORKDIR
    environment:
    
      - SECRET_KEY=mysecretkey

      - RABBITMQ_DEFAULT_USER=yehuda
      - RABBITMQ_DEFAULT_PASS=1234

      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672

      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - USER_MANAGEMENT_URL=http://user-management:8001
      - CART_SERVICE_URL=http://cart-service:8003


    depends_on:
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      redis:
        condition: service_started



  email-notification-service:
    build: services\email-notification-service
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://yehuda:1234@rabbitmq:5672/
      QUEUE_NAME: order.place
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
    env_file:
      - services\email-notification-service/.env 


configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."  


volumes:
  elasticsearch_data:
  minio_data:
  redis_data:
  rabbitmq-lib:
    driver: local
  rabbitmq-log:
    driver: local

  